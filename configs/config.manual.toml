# Hand-built config for Manual CI (workflow_dispatch -> "configs/config.manual.toml").
# It never touches configs/config.toml or the watcher, so it is the place to try apps end to end, or to
# re-run ones the watcher cannot retrigger. Edit, publish with
#   git commit -am "chore(config): ..." && git push
# and run Manual CI.
#
# Currently: three stock apps mirrored unmodified, each pulled as directly as its vendor allows. Keys sit
# on each app because build.sh takes no file-level `version` from a TOML it reads directly.
mirror = true
brand = "Mirror"
arch = "arm64-v8a"

[Stremio]
version = "latest"
app-name = "Stremio"
pkg-name = "com.stremio.one"
# The vendor's own per-arch APK from stremio.com/downloads; the file name carries package and version.
direct-dlurl = "https://dl.strem.io/android/v2.3.2-android/com.stremio.one-2.3.2-7145730-arm64-v8a.apk"

[Bitget]
version = "latest"
app-name = "Bitget"
pkg-name = "com.bitget.exchange"
# The vendor's own APK behind bitget.com/download's "Android 1" button: static.bitget.com + the
# androidLink from /v1/mix/public/getH5DownloadConfig + the app version + ".apk". The version is in
# the URL, so bump it by hand. The stores only serve split bundles, which a mirror will not re-sign.
direct-dlurl = "https://static.bitget.com/apps/android/bitget-ant7-3.0.1.apk"
apkmirror-dlurl = "https://www.apkmirror.com/apk/bg-limited/bitget-buy-sell-crypto/"
uptodown-dlurl = "https://bitget.en.uptodown.com/android"

[RedotPay]
version = "latest"
app-name = "RedotPay"
pkg-name = "com.redotpay"
# The vendor's own APK from redotpay.com/app-download. Its name carries no version ("latest"); a mirror
# publishes under the versionName the APK itself reports, so that is enough.
direct-dlurl = "https://rp-static-apne1.s3.ap-northeast-1.amazonaws.com/app/redotpay-latest.apk"
uptodown-dlurl = "https://redotpay.en.uptodown.com/android"
