# Hand-built config for Manual CI (workflow_dispatch -> "configs/config.manual.toml").
# It never touches the stable/beta pools, so it is the place to try apps end to end, or to
# re-run ones the watcher cannot retrigger. Edit, publish with
#   git commit -am "chore(config): ..." && git push
# and run Manual CI.
#
# Currently: Truecaller from APKMirror alone (no archive.org, Uptodown or APKPure), to see
# whether the store the other apps use serves the version the patches target.
brand = "Morphe"
arch = "arm64-v8a"

[Truecaller]
patches-source = "Paresh-Maheshwari/paresh-patches"
patches-source-host = "gitlab"
pkg-name = "com.truecaller"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/true-software-scandinavia-ab/truecaller-caller-id-block/"
