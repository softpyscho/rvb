# Hand-built config for Manual CI (workflow_dispatch -> "configs/config.manual.toml").
# It never touches the stable/beta pools, so it is the place to try apps end to end, or to
# re-run ones the watcher cannot retrigger. Edit, publish with
#   git commit -am "chore(config): ..." && git push
# and run Manual CI.
#
# Currently: the two WhatsApp mirrors, to confirm on a GitHub-hosted runner that APKMirror
# (through the Cloudflare solver), or Uptodown as its fallback, serves the newest build the latest
# WaEnhancer release supports. Keys sit on each app because build.sh takes no file-level `version`
# from a TOML it reads directly (only the compiled pool JSON carries file-level keys into an app).
brand = "Mirror"
arch = "arm64-v8a"

[WhatsApp]
mirror = true
brand = "Mirror"
app-name = "WhatsApp"
version = "waenhancer"
pkg-name = "com.whatsapp"
apkmirror-dlurl = "https://www.apkmirror.com/apk/whatsapp-inc/whatsapp-messenger/"
uptodown-dlurl = "https://whatsapp-messenger.en.uptodown.com/android"

[WhatsApp-Business]
mirror = true
brand = "Mirror"
app-name = "WhatsApp Business"
version = "waenhancer"
pkg-name = "com.whatsapp.w4b"
apkmirror-dlurl = "https://www.apkmirror.com/apk/whatsapp-inc/whatsapp-messenger-business/"
uptodown-dlurl = "https://whatsapp-business.en.uptodown.com/android"
