# Hand-built config for Manual CI (workflow_dispatch -> "configs/config.manual.toml").
# It never touches configs/config.toml or the watcher, so it is the place to try apps end to end, or to
# re-run ones the watcher cannot retrigger. Edit, publish with
#   git commit -am "chore(config): ..." && git push
# and run Manual CI.
#
# Currently: Alarmy, as an example of a patched app. Replace it with whatever you want to try. Keys sit
# on each app because build.sh takes no file-level `version` from a TOML it reads directly.
brand = "Morphe"
arch = "arm64-v8a"

[Alarmy]
patches-source = "rabilrbl/fluffy-patches"
pkg-name = "droom.sleepIfUCan"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/sleep-tracker-alarm-clock-by-delightroom/alarmy-challenge-alarm-clock/"
uptodown-dlurl = "https://alarmy.en.uptodown.com/android"
