# crimera/piko — X (Twitter) and Instagram.
patches-source = "crimera/piko"
brand = "Morphe"
arch = "arm64-v8a"

[Twitter]
pkg-name = "com.twitter.android"
badge-color = "000000"
badge-icon = "x"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/twitter/com.twitter.android"

[Instagram]
pkg-name = "com.instagram.android"
badge-color = "FF0069"
badge-icon = "instagram"
version = "auto"
# Stable patches. It used to follow Piko's beta ("dev") line, but Piko's stable v3.10.0 (published after
# that beta) supports the same Instagram build (447.0.0.55.81) with the same 62 patches, so nothing here
# needs a pre-release bundle. To follow the beta line again, set patches-version = "beta" on this app.
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
github-dlurl = "https://github.com/softpyscho/apkforge/releases/tag/com.instagram.android"
apkpure-dlurl = "https://apkpure.com/instagram/com.instagram.android"
