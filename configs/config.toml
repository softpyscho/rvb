# RVB: the one config for every app.
#
# Each app is a [Table]; its keys are documented in CONFIG.md. Keys written here, before the first table,
# are defaults for every app that does not set them itself.
#
# One build, no beta channel. Every app is built with its patch source's latest stable release unless it
# pins a tag with `patches-version`; "beta" and "both" are rejected. Whether a *version* is experimental is
# a different thing, decided by `version` ("auto" = what the patches support, "exp" = their experimental
# targets) and shown in the README's Channel column.
#
# Order matters only for the README: the apps of one patch source are listed in the order they have here.
# Stock mirrors (`mirror = true`) republish the stock APK and use no patch source.
#
# Every store app also names APKPure as the last-resort store: it is only asked when APKMirror and Uptodown
# failed for that version.
arch = "arm64-v8a"
brand = "Morphe"


# ----------------------------------------------------------------------------------------------------
# arandomhooman/hoomans-morphe-patches — Battery Guru, on the stable patches. The source's beta line is
# months behind (v1.44.0-dev.4 vs v1.53.0) and only knows Battery Guru 2.4.8.1 / 2.5.0.2-beta1: the APK
# calls itself 2.5.0.2, so no patch applied. The stable bundle supports the current release.
[Battery-Guru]
patches-source = "arandomhooman/hoomans-morphe-patches"
pkg-name = "com.paget96.batteryguru"
badge-color = "4CAF50"
badge-icon = "battery_charging_full"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/paget96/battery-guru-health-saver/"
uptodown-dlurl = "https://battery-guru.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/battery-guru/com.paget96.batteryguru"

