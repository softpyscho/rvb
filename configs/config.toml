# ----------------------------------------------------------------------------------------------------
# Stock APKs re-hosted unmodified, so Obtainium can track apps that publish no GitHub
# release of their own. `mirror = true` skips the patcher entirely: the engine downloads the
# stock APK, checks package/signature/arch like any other build, and publishes it as-is.
# No patch source is involved, so none is set here.
[Bitget]
mirror = true
brand = "Mirror"
version = "latest"
app-name = "Bitget"
pkg-name = "com.bitget.exchange"
apkmirror-dlurl = "https://www.apkmirror.com/apk/bg-limited/bitget-buy-sell-crypto/"
uptodown-dlurl = "https://bitget.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/bitget-buy-sell-crypto/com.bitget.exchange"

[Stremio]
mirror = true
brand = "Mirror"
version = "latest"
app-name = "Stremio"
pkg-name = "com.stremio.one"
# Both stores serve Stremio only as a split bundle, which cannot be republished without signing it
# with this repository's key. Stremio has no account to ban, so a re-signed copy is accepted here
# once no source gives a plain APK; the README says which it is. Uninstall the store copy first.
allow-resign = true
# direct-dlurl = "https://www.stremio.com/downloads" is not carried over: it is a web page, and the
# engine's `direct` source needs a URL that ends in the APK's own file name.
apkmirror-dlurl = "https://www.apkmirror.com/apk/stremio/stremio-2/"
uptodown-dlurl = "https://stremio-one.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/stremio/com.stremio.one"

[Mixplorer]
mirror = true
brand = "Mirror"
version = "latest"
app-name = "Mixplorer"
pkg-name = "com.mixplorer"
apkmirror-dlurl = "https://www.apkmirror.com/apk/hootan-parsa/mixplorer-hootanparsa/"
uptodown-dlurl = "https://mixplorer.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/mixplorer/com.mixplorer"

[Mix-Archive]
mirror = true
brand = "Mirror"
version = "latest"
app-name = "Mix Archive"
pkg-name = "com.mixplorer.addon.archive"
apkmirror-dlurl = "https://www.apkmirror.com/apk/hootan-parsa/mix-archive/"
uptodown-dlurl = "https://mix-archive.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/mix-archive/com.mixplorer.addon.archive"

[RedotPay]
mirror = true
brand = "Mirror"
version = "latest"
app-name = "RedotPay"
pkg-name = "com.redotpay"
# direct-dlurl = "https://www.redotpay.com/app-download" is not carried over (a web page, see Stremio).
uptodown-dlurl = "https://redotpay.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/redotpay/com.redotpay"

[Duck-Detector]
mirror = true
brand = "Mirror"
app-name = "Duck Detector"
pkg-name = "com.eltavine.duckdetector"
# A nightly build has no version number to put in a file name, so the asset keeps its own.
keep-filename = true
version = "nightly"
arch = "all"
github-dlurl = "https://github.com/eltavine/Duck-Detector-Refactoring/releases/tag/nightly"

[Oxygen-Customizer]
mirror = true
brand = "Mirror"
version = "latest"
app-name = "Oxygen Customizer"
pkg-name = "it.dhd.oxygencustomizer"
arch = "all"
# The nightly is a workflow artifact (one per push to its beta branch), never a release; the
# run number is the version. Each run uploads a release and a "... Debug" artifact.
actions-dlurl = "https://github.com/DHD2280/Oxygen-Customizer/actions/workflows/build_debug.yml"
actions-artifact = 'Dev \(#[0-9]+\)$'

# WhatsApp follows WaEnhancer (Dev4Mod/WaEnhancer): `version = "waenhancer"` mirrors
# the newest stable build that the latest WaEnhancer release lists as supported (its arrays.xml,
# e.g. 2.26.40.xx), because a newer WhatsApp breaks the module. A new WaEnhancer release, or a
# new build inside what it supports, is what moves it. WhatsApp Business was dropped on 2026-10-12: no
# source offers it as a plain APK, only as split bundles, which a mirror may not re-sign.
# APKMirror is asked first (CI reaches it through the Cloudflare solver sidecar); when it lists
# no supported build, or its download fails, Uptodown is asked for the same version.
[WhatsApp]
mirror = true
brand = "Mirror"
app-name = "WhatsApp"
version = "waenhancer"
pkg-name = "com.whatsapp"
apkmirror-dlurl = "https://www.apkmirror.com/apk/whatsapp-inc/whatsapp-messenger/"
uptodown-dlurl = "https://whatsapp-messenger.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/whatsapp-messenger/com.whatsapp"

# ----------------------------------------------------------------------------------------------------
# MorpheApp/morphe-patches — the reference Morphe bundle.
[Reddit]
patches-source = "MorpheApp/morphe-patches"
pkg-name = "com.reddit.frontpage"
badge-color = "FF4500"
badge-icon = "reddit"
# Experimental on purpose: the patches flag Reddit's newest builds (2026.39.0 - 2026.41.0) as
# experimental and their stable targets stop at 2026.24.0. Naming `exp` makes that choice visible
# here (and in the README's Channel column) instead of leaving it to `auto`, which only reached
# an experimental version because `included-patches` is set below.
version = "exp"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/reddit/com.reddit.frontpage"
# 'Custom branding name for Reddit' is opt-in, so it is named in included-patches (the one
# place patch names are quoted for the CLI) and only its option value rides in patcher-args.
included-patches = "'Custom branding name for Reddit'"
patcher-args = "-OappName='Reddit'"

