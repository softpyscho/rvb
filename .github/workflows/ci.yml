name: CI

on:
  schedule:
    # Once a day at 00:00 IST (UTC+5:30, no daylight saving) = 18:30 UTC the day before. The watcher
    # builds only when something moved, so a quiet day costs the check steps and nothing else.
    - cron: "30 18 * * *"
  workflow_dispatch:

# The reusable workflows called below ask for these themselves (branch and release writes,
# workflow-run cleanup). A caller that grants nothing explicit fails at startup on a
# repository whose default token is read-only, before any job runs.
permissions:
  contents: write
  actions: write

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 60
    services:
      cf_solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    outputs:
      trigger_build: ${{ steps.effective_triggers.outputs.TRIGGER_BUILD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python dependencies
        run: pip install --no-cache-dir curl_cffi || true

      - name: Compile Base Configs (JSON)
        run: bash .github/scripts/ci_compile_base_configs.sh

      - name: Sync Patch Sources
        id: sync_patch_sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: python3 .github/scripts/sync_patch_sources.py

      - name: Fetch App Versions
        id: fetch_app_versions
        env:
          CF_SOLVER_URL: "http://localhost:8000"
        run: bash .github/scripts/ci_fetch_app_versions.sh

      - name: Compare App Versions
        id: compare_apps
        run: bash .github/scripts/ci_compare_app_versions.sh

      # Single owner of "is there any work left downstream". Every step below
      # reads these two outputs instead of re-pasting the trigger expressions.
      - name: Classify triggers
        id: flags
        env:
          TRIGGER_PATCHES: ${{ steps.sync_patch_sources.outputs.TRIGGER_PATCHES || '0' }}
          TRIGGER_BLOCKED: ${{ steps.sync_patch_sources.outputs.TRIGGER_BLOCKED || '0' }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_trigger_flags.sh

      - name: Check Patch App Updates
        if: ${{ steps.flags.outputs.SOURCES_CHANGED == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_check_app_patches.py

      - name: Generate configs (JSON)
        if: ${{ steps.flags.outputs.ANYTHING_CHANGED == '1' }}
        id: generate_configs
        env:
          TRIGGER_PATCHES: ${{ steps.sync_patch_sources.outputs.TRIGGER_PATCHES }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          TRIGGER_BLOCKED: ${{ steps.sync_patch_sources.outputs.TRIGGER_BLOCKED }}
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Resolve effective triggers
        id: effective_triggers
        env:
          RAW_TRIGGER_PATCHES: ${{ steps.sync_patch_sources.outputs.TRIGGER_PATCHES || '0' }}
          RAW_TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_resolve_triggers.sh

      - name: Notify telegram
        if: ${{ steps.flags.outputs.ANYTHING_CHANGED == '1' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: "${{ vars.TG_CHAT_ID }}"
          TG_THREAD_CI: "${{ vars.TG_THREAD_CI }}"
          TRIGGER_PATCHES: ${{ steps.sync_patch_sources.outputs.TRIGGER_PATCHES }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          EFFECTIVE_BUILD: ${{ steps.effective_triggers.outputs.TRIGGER_BUILD }}
        run: bash .github/scripts/ci_notify_telegram.sh

      - name: Commit updated patch sources and configs
        if: ${{ steps.flags.outputs.ANYTHING_CHANGED == '1' }}
        # Commits state/*.json + configs/build.json onto main (plumbing only: the
        # checkout is never switched). Only these generated files are named, so the
        # hand-edited TOMLs can never ride along.
        run: |
          bash .github/scripts/commit_to_main.sh \
            "chore: update generated patch sources, app versions and configs" \
            configs/build.json state/*.json

  build:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_build == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/build.json"
    secrets: inherit

  trigger_cleanup:
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [check_patch, build]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "CI"
    secrets: inherit
