name: Manual CI

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "What to build, from configs/config.toml: all = stable then beta apps, stable = the apps on the stable patches, beta = the apps on the beta patches, manual = configs/config.manual.toml"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "stable"
          - "beta"
          - "manual"
      remove_apks:
        description: "Optional: APKs to remove from cache (space-separated, e.g., com.brave.browser-1.93.138-*.apk)"
        required: false
        type: string
        default: ""
      clean:
        description: "Clean build: start from an empty APK cache and skip the cache repo, so every stock APK is downloaded fresh"
        required: false
        type: boolean
        default: false

# The reusable workflows called below ask for these themselves (branch and release writes,
# workflow-run cleanup). A caller that grants nothing explicit fails at startup on a
# repository whose default token is read-only, before any job runs.
permissions:
  contents: write
  actions: write

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build_manual:
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ inputs.config_file }}
      remove_apks: ${{ inputs.remove_apks }}
      clean: ${{ inputs.clean }}
    secrets: inherit

  trigger_cleanup:
    needs: [build_manual]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [build_manual]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "Manual CI"
    secrets: inherit
