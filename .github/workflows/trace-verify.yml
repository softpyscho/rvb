name: Trace Verify

on:
  push:
    paths:
      - "scripts/build.sh"
      - "scripts/utils.sh"
      - ".github/traces/**"
      - ".github/scripts/generate_release_notes.py"
      - ".github/scripts/obtainium.py"
      - ".github/scripts/ci_fetch_app_versions.sh"
      - ".github/scripts/cleanup_update_branch.sh"
      - ".github/scripts/update_readme.sh"
      - ".github/scripts/patchers.py"
      - ".github/scripts/build_make_manifest.py"
      - "configs/patches/**"
      - ".github/scripts/commit_to_main.sh"
      - ".github/scripts/build_plan_configs.sh"
      - ".github/scripts/build_prepare_config.sh"
      - ".github/scripts/merge_archive_manifest.sh"
      - ".github/scripts/cleanup_manifests.sh"
      - "README.md"
      - "OBTAINIUM.md"
      - "obtainium-apps.json"
  workflow_dispatch:

concurrency:
  group: trace-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run trace harness verify
        run: |
          sudo apt-get update && sudo apt-get install -y jq || true
          bash .github/traces/trace_runner.sh verify

      - name: Run helper regression tests
        run: |
          bash .github/traces/test_cache_helpers.sh
          bash .github/traces/test_bundle_helpers.sh
          bash .github/traces/test_mirror.sh
          python3 .github/traces/test_release_notes.py
          bash .github/traces/test_ci_app_versions.sh
          bash .github/traces/test_github_versions.sh
          bash .github/traces/test_cleanup_update_branch.sh
          bash .github/traces/test_update_readme.sh
          bash .github/traces/test_build_plan.sh
          bash .github/traces/test_build_record.sh
          bash .github/traces/test_commit_to_main.sh
          bash .github/traces/test_manifest_scripts.sh
