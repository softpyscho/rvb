# Hand-built config for Manual CI (workflow_dispatch -> "configs/config.manual.toml").
# It never touches the stable/beta pools, so it is the place to try one app end to end
# before (or instead of) waiting for the watcher. Edit, publish with
#   bash .github/scripts/push_data_configs.sh "chore(config): ..."
# and run Manual CI.
patches-source = "MorpheApp/morphe-patches"
brand = "Morphe"
arch = "arm64-v8a"

[Reddit]
pkg-name = "com.reddit.frontpage"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
