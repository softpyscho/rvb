# MorpheApp/morphe-patches — the reference Morphe bundle.
patches-source = "MorpheApp/morphe-patches"
brand = "Morphe"
arch = "arm64-v8a"

[Reddit]
pkg-name = "com.reddit.frontpage"
badge-color = "FF4500"
badge-icon = "reddit"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
# 'Custom branding name for Reddit' is opt-in, so it is named in included-patches (the one
# place patch names are quoted for the CLI) and only its option value rides in patcher-args.
included-patches = "'Custom branding name for Reddit'"
patcher-args = "-OappName='Reddit'"
